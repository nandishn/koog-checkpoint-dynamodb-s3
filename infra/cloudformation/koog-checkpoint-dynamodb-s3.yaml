AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB and S3 infrastructure for koog-checkpoint-dynamodb-s3.

Parameters:
  TableName:
    Type: String
    Default: koog-checkpoints
  BucketName:
    Type: String
  CheckpointPrefix:
    Type: String
    Default: koog/checkpoints
  ExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
  EnableExpiration:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  HasExpiration: !Equals [!Ref EnableExpiration, "true"]

Resources:
  CheckpointTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  PayloadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration: !If
        - HasExpiration
        - Rules:
            - Id: ExpireKoogCheckpoints
              Status: Enabled
              Prefix: !Ref CheckpointPrefix
              ExpirationInDays: !Ref ExpirationDays
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
        - !Ref AWS::NoValue

Outputs:
  DynamoDbTableName:
    Value: !Ref CheckpointTable
  S3BucketName:
    Value: !Ref PayloadBucket
