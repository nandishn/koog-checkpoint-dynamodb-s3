name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      localstack:
        image: localstack/localstack:4.12
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${RELEASE_VERSION}" in
            ""|*-SNAPSHOT)
              echo "Release version must be non-empty and must not end with -SNAPSHOT"
              exit 1
              ;;
          esac
          if ! printf '%s' "${RELEASE_VERSION}" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+([.-][A-Za-z0-9]+)*$'; then
            echo "Release version must look like 0.1.0 or 0.1.0-rc1"
            exit 1
          fi
      - name: Wait for LocalStack
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4566/_localstack/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          curl -fsS http://localhost:4566/_localstack/health
      - name: Check
        run: ./gradlew check
      - name: Integration Test
        env:
          KOOG_AWS_INTEGRATION_TESTS: "true"
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: ./gradlew integrationTest
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew "-PreleaseVersion=${RELEASE_VERSION}" publishToMavenCentral
